version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-org_website}
      POSTGRES_USER:     ${POSTGRES_USER:-org_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strongpassword}
    healthcheck:
      test:     ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-org_user}"]
      interval: 10s
      timeout:  5s
      retries:  5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL:     redis://redis:6379/0
    volumes:
      - media_files:/app/media
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --settings=config.settings.production &&
             python manage.py collectstatic --noinput --settings=config.settings.production &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"

  celery_worker:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [backend, redis]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL:     redis://redis:6379/0
    volumes:
      - media_files:/app/media
    command: celery -A config worker --loglevel=info --concurrency=4

  celery_beat:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [backend, redis]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL:     redis://redis:6379/0
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    env_file: .env
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on: [backend, frontend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_files:/var/www/media:ro

volumes:
  postgres_data:
  redis_data:
  media_files:
